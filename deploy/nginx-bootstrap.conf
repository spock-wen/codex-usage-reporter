# Install only as /etc/nginx/sites-available/usage.wenspock.site.
# HTTP challenge bootstrap; enable HTTPS config after certificate issuance.
server {
    listen 80;
    listen [::]:80;
    server_name usage.wenspock.site;
    access_log off;
    error_log /dev/null crit;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://usage.wenspock.site$request_uri;
    }
}
