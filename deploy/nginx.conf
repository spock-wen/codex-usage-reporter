# Dedicated vhost. No changes to other sites or global nginx configuration.
server {
    listen 80;
    listen [::]:80;
    server_name usage.wenspock.site;
    access_log off;
    error_log /dev/null crit;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://usage.wenspock.site$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name usage.wenspock.site;
    ssl_certificate /etc/letsencrypt/live/usage.wenspock.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/usage.wenspock.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CodexUsageTLS:10m;
    ssl_session_timeout 1d;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 17m;

    location / {
        proxy_pass http://127.0.0.1:18765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;
    }
}
